<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
  <title>Edit Details</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background:#F3F4F6; color:#1F2937; -webkit-tap-highlight-color: transparent; }
    .card { background:#fff; border-radius:1.25rem; border:1px solid #E5E7EB; box-shadow:0 4px 6px -1px rgba(0,0,0,.05); padding:1.1rem; }
    .input { background:#F9FAFB; border:1px solid #D1D5DB; border-radius:.9rem; padding:.85rem; width:100%; outline:none; transition:.2s; font-size:.95rem; color:#374151; }
    .input:focus { background:#fff; border-color:#3B82F6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
    .input.err { border-color:#EF4444 !important; background-color:#FEF2F2 !important; box-shadow:0 0 0 3px rgba(239,68,68,.15) !important; }
    .textarea { background:#F9FAFB; border:1px solid #D1D5DB; border-radius:.9rem; padding:.85rem; width:100%; outline:none; transition:.2s; font-size:.95rem; color:#374151; resize:none; min-height:110px; line-height:1.5; }
    .textarea:focus { background:#fff; border-color:#3B82F6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
    .info-badge { font-size:11px; font-weight:700; background:#EFF6FF; color:#2563EB; padding:4px 12px; border-radius:9999px; border:1px solid #DBEAFE; display:inline-flex; align-items:center; white-space:nowrap; }
    .btn-primary { width:100%; background:#60A5FA; color:#fff; padding:1rem; border-radius:1rem; font-weight:700; font-size:1.1rem; box-shadow:0 10px 15px -3px rgba(96,165,250,.3); transition:all .15s; }
    .btn-primary:hover  { background:#3B82F6; }
    .btn-primary:active { transform:scale(.98); }
    .btn-primary:disabled { opacity:.55; cursor:not-allowed; }
    .btn-ghost { width:100%; background:#fff; border:1px solid #E5E7EB; color:#9CA3AF; padding:.75rem; border-radius:1rem; font-weight:700; transition:colors .15s; }
    .btn-ghost:hover { background:#F9FAFB; }
    ::-webkit-scrollbar { display:none; }
  </style>
</head>

<body class="pb-32 antialiased">
<div class="max-w-md mx-auto min-h-screen flex flex-col relative">

  <!-- Header -->
  <div class="bg-white px-6 pt-10 pb-4 rounded-b-3xl shadow-sm mb-4 relative z-10 border-b border-slate-100">
    <div class="flex items-center gap-4">
      <div id="avatarBox" class="w-12 h-12 rounded-full overflow-hidden border-2 border-white shadow-md ring-2 ring-blue-50 hidden">
        <img id="profileImg" src="" class="w-full h-full object-cover" alt="profile">
      </div>
      <div>
        <h1 id="title" class="text-2xl font-bold text-[#1F2937] tracking-tight">Edit Details ✏️</h1>
        <p id="userGreet" class="text-[#9CA3AF] text-sm font-medium mt-0.5 flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Loading...
        </p>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="px-5 space-y-6 flex-1" id="rootBox"></div>

  <!-- Bottom bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-[#F3F4F6] p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom))] z-40 hidden" id="bottomBar">
    <button id="submitBtn" class="btn-primary">บันทึกการแก้ไข</button>
  </div>

  <!-- Loader -->
  <div id="loader" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center max-w-[180px] w-full">
      <div class="w-10 h-10 border-4 border-[#F3F4F6] border-t-[#3B82F6] rounded-full animate-spin mb-4"></div>
      <div class="font-bold text-[#1F2937] text-sm" id="loaderText">Processing...</div>
    </div>
  </div>

</div>

<script>
"use strict";

/* ── Config ──────────────────────────────────────── */
const LIFF_ID = "2008997153-opOWuU0Y";
const API_URL = "https://script.google.com/macros/s/AKfycbzjatOY93-6QIVPdBSxJyzQhMw9DfqwlgFVdvEanLpZgNZ_1ACwyrUKMGvgnCArwSzWHQ/exec";

/* ── State ───────────────────────────────────────── */
let userProfile = null;
let claimData   = null;
let requestId   = "";

/* ── DOM refs (resolved once after DOMContentLoaded) ── */
const $id = (id) => document.getElementById(id);

/* ── Loader ──────────────────────────────────────── */
function showLoader(msg) {
  $id("loaderText").textContent = msg || "Processing...";
  $id("loader").classList.replace("hidden", "flex");
}
function hideLoader() {
  $id("loader").classList.replace("flex", "hidden");
}

/* ── Escape helpers ──────────────────────────────── */
function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ── Close ───────────────────────────────────────── */
function doneAndExit() {
  try { if (liff.isInClient()) { liff.closeWindow(); return; } } catch (_) {}
  try { window.close(); } catch (_) {}
}

/* ── Header helpers ──────────────────────────────── */
function setHeader(title, subtitleHtml) {
  if (title)       $id("title").textContent = title;
  if (subtitleHtml) $id("userGreet").innerHTML = subtitleHtml;
}

/* ── Submit button state ─────────────────────────── */
function setBtnDisabled(disabled) {
  $id("submitBtn").disabled = !!disabled;
}

/* ── KV row ──────────────────────────────────────── */
function kvRow(label, valueHtml) {
  return `
    <div class="flex items-baseline space-x-3">
      <span class="text-[#9CA3AF] text-xs w-20 flex-shrink-0">${esc(label)}</span>
      <span class="font-bold text-[#1F2937] text-sm break-words flex-1 whitespace-pre-wrap">${valueHtml}</span>
    </div>`;
}

/* ── Formatting ──────────────────────────────────── */
function formatAmountTHB(v) {
  const n = Number(v || 0);
  if (isNaN(n)) return "-";
  return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " บาท";
}

function formatReqNo(claim) {
  const shortId = String(claim?.shortRequestId || "").trim();
  if (shortId) return "#" + shortId;
  const reqId = String(claim?.requestId || "").trim();
  if (!reqId) return "-";
  return "#" + (reqId.length <= 8 ? reqId : reqId.slice(-8));
}

function parseAmountClient(raw) {
  let s = String(raw || "").trim()
    .replace(/บาท/gi, "").replace(/,/g, "").replace(/\s+/g, "");
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return { ok: false };
  const amount = Number(s);
  if (isNaN(amount) || amount <= 0 || amount > 99_999_999) return { ok: false };
  return { ok: true, amount, normalized: s };
}

function normalizeNoteClient(raw) {
  return String(raw ?? "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").trim();
}

/* ── Amount field validation ─────────────────────── */
function clearAmountErr() {
  $id("amountInput").classList.remove("err");
  $id("amountErr").classList.add("hidden");
}
function showAmountErr(msg) {
  $id("amountInput").classList.add("err");
  $id("amountErr").textContent = msg;
  $id("amountErr").classList.remove("hidden");
}

/* ── Error screens ───────────────────────────────── */
function renderSystemError(msg) {
  setHeader("System Error", "Please try again");
  $id("bottomBar").classList.add("hidden");
  $id("rootBox").innerHTML = `
    <div class="card text-center py-10 mt-6">
      <div class="text-4xl mb-3">⚠️</div>
      <div class="text-lg font-bold text-[#1F2937]">System Error</div>
      <div class="text-sm text-[#9CA3AF] mt-2">${esc(msg || "ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง")}</div>
      <button class="btn-primary mt-6" onclick="location.reload()">Try Again</button>
      <button class="btn-ghost mt-3"   onclick="doneAndExit()">Close</button>
    </div>`;
}

function renderNotFound() {
  setHeader("Not Found", "Error");
  $id("bottomBar").classList.add("hidden");
  $id("rootBox").innerHTML = `
    <div class="card text-center py-10 mt-6">
      <div class="text-4xl mb-3">📄❓</div>
      <div class="text-lg font-bold text-[#1F2937]">ไม่พบรายการเบิกเงินค่ะ</div>
      <div class="text-sm text-[#9CA3AF] mt-2">โปรดตรวจสอบลิงก์อีกครั้ง</div>
      <button class="btn-primary mt-6" onclick="doneAndExit()">ปิดหน้าต่าง</button>
    </div>`;
}

function renderForbidden(msg) {
  setHeader("Not Allowed", "Action not permitted");
  $id("bottomBar").classList.add("hidden");
  $id("rootBox").innerHTML = `
    <div class="card text-center py-10 mt-6">
      <div class="text-4xl mb-3">⛔</div>
      <div class="text-lg font-bold text-[#1F2937]">ไม่สามารถแก้ไขรายละเอียดได้</div>
      <div class="text-sm text-[#9CA3AF] mt-2">${esc(msg || "รายการนี้ไม่อยู่ในสถานะ Draft หรือไม่ใช่ของคุณ")}</div>
      <button class="btn-primary mt-6" onclick="doneAndExit()">ปิดหน้าต่าง</button>
    </div>`;
}

/* ── Main form ───────────────────────────────────── */
function renderForm(claim) {
  const reqNo  = formatReqNo(claim);
  const status = String(claim.status || "").toUpperCase();
  const note   = String(claim.note || "");
  const noteDisplay = note ? esc(note) : "—";

  setHeader("Edit Details ✏️",
    `Hi, <span class="font-bold text-[#1F2937]">${esc(userProfile?.displayName || "")}</span>`);

  $id("rootBox").innerHTML = `
    <div class="card space-y-3">
      <div class="flex justify-between items-center px-1 h-7">
        <label class="text-sm font-bold text-[#1F2937]">Expense Claim Info</label>
        <span class="info-badge">${esc(status || "DRAFT")}</span>
      </div>
      <div class="space-y-3 px-1 mt-2">
        ${kvRow("Req No.", `<span class="font-mono">${esc(reqNo)}</span>`)}
        ${kvRow("Company", esc(claim.company || "-"))}
        ${kvRow("Amount",  esc(formatAmountTHB(claim.amount)))}
        ${kvRow("Note",    noteDisplay)}
      </div>
    </div>

    <div class="card space-y-4">
      <div>
        <label class="text-sm font-bold text-[#1F2937] block mb-2 ml-1">
          New Amount <span class="text-[#EF4444]">*</span>
        </label>
        <input id="amountInput" type="text" inputmode="decimal" class="input font-bold text-[#1F2937]"
               placeholder="เช่น 1200 หรือ 1,200.50"
               value="${esc(String(Number(claim.amount || 0) || ""))}">
        <div id="amountErr" class="hidden text-xs text-[#EF4444] mt-2 font-bold ml-1"></div>
      </div>

      <div>
        <label class="text-sm font-bold text-[#1F2937] block mb-2 ml-1">Note (optional)</label>
        <textarea id="noteInput" class="textarea" placeholder="เพิ่มรายละเอียดเพิ่มเติม (ถ้ามี)" maxlength="500">${esc(note)}</textarea>
      </div>

      <div class="flex items-start gap-2 bg-[#F8FAFC] p-3 rounded-xl border border-[#F1F5F9]">
        <span class="text-[#94A3B8] mt-0.5">ℹ️</span>
        <div class="text-[11px] text-[#64748B] font-medium leading-relaxed">
          สามารถแก้ไขรายละเอียดได้เฉพาะรายการที่อยู่ในสถานะ Draft เท่านั้น
        </div>
      </div>
    </div>`;

  // Event listeners (no inline onclick — Fix #13)
  $id("amountInput").addEventListener("input", clearAmountErr);
  $id("submitBtn").addEventListener("click", handleSubmit);

  $id("bottomBar").classList.remove("hidden");
  setBtnDisabled(false);
}

/* ── API calls ───────────────────────────────────── */
async function apiGetClaim(rid, actorUserId) {
  const res = await fetch(
    API_URL + "?action=get_claim"
    + "&requestId="  + encodeURIComponent(rid)
    + "&actorUserId=" + encodeURIComponent(actorUserId)
    + "&t=" + Date.now()
  );
  return res.json();
}

async function postForm(obj) {
  const body = new URLSearchParams();
  Object.keys(obj || {}).forEach(k => body.set(k, obj[k] == null ? "" : String(obj[k])));
  const res = await fetch(API_URL, {
    method:  "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
    body:    body.toString()
  });
  return res.json();
}

/* ── Submit handler ──────────────────────────────── */
async function handleSubmit() {
  clearAmountErr();

  const rawAmount = ($id("amountInput")?.value || "").trim();
  const parsed    = parseAmountClient(rawAmount);
  if (!parsed.ok) {
    showAmountErr("กรุณาระบุจำนวนเงินให้ถูกต้อง (เช่น 1200.50, สูงสุด 99,999,999)");
    return;
  }

  const note = normalizeNoteClient($id("noteInput")?.value || "");
  if (note.length > 500) {
    alert("Note ยาวเกิน 500 ตัวอักษร");
    return;
  }

  showLoader("Saving...");
  setBtnDisabled(true);

  try {
    const data = await postForm({
      action:       "update_claim_details",
      requestId,
      actorUserId:  userProfile.userId,
      amount:       parsed.normalized,
      note
    });

    if (!data?.ok) {
      hideLoader();
      setBtnDisabled(false);
      const code = String(data?.error || "unknown_error");
      if (code === "missing_amount" || code === "invalid_amount") {
        showAmountErr("กรุณาระบุจำนวนเงินให้ถูกต้อง");
      } else if (code === "note_too_long") {
        alert("Note ยาวเกินไปค่ะ (สูงสุด 500 ตัวอักษร)");
      } else if (code === "not_owner") {
        renderForbidden("รายการนี้ไม่ใช่ของคุณ");
      } else if (code === "cannot_edit_non_draft") {
        renderForbidden("แก้ไขรายละเอียดได้เฉพาะรายการที่อยู่ในสถานะ Draft");
      } else if (code === "claim_not_found") {
        renderNotFound();
      } else {
        alert("❌ Save failed: " + code);
      }
      return;
    }

    // Send notify message to chat
    const shortId = String(claimData?.shortRequestId || "").trim();
    const notifyText = shortId
      ? "อัปเดตรายการแล้ว #" + shortId
      : "CLAIM_DRAFT_UPDATED:" + requestId;
    try { await liff.sendMessages([{ type: "text", text: notifyText }]); } catch (_) {}

    hideLoader();
    $id("bottomBar").classList.add("hidden");

    $id("rootBox").innerHTML = `
      <div class="card text-center py-12 mt-10 border border-[#10B981] shadow-lg shadow-green-100">
        <div class="w-20 h-20 rounded-full bg-[#ECFDF5] flex items-center justify-center text-[#10B981] text-4xl mx-auto mb-4 animate-bounce">✅</div>
        <div class="text-xl font-bold text-[#1F2937]">Details updated.</div>
        <div class="text-sm text-[#9CA3AF] mt-2">ยืนยันรายการต่อในแชท</div>
      </div>`;

    setTimeout(doneAndExit, 1200);

  } catch (err) {
    hideLoader();
    setBtnDisabled(false);
    alert("❌ Save failed: " + (err?.message || err));
  }
}

/* ── Init ────────────────────────────────────────── */
async function init() {
  showLoader("Loading...");

  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) { liff.login(); return; }

  const params = new URLSearchParams(location.search);
  requestId = String(params.get("requestId") || "").trim();
  if (!requestId) { hideLoader(); renderNotFound(); return; }

  userProfile = await liff.getProfile();

  if (userProfile.pictureUrl) {
    $id("profileImg").src = userProfile.pictureUrl;
    $id("avatarBox").classList.remove("hidden");
  }
  setHeader("Edit Details ✏️",
    `Hi, <span class="font-bold text-[#1F2937]">${esc(userProfile.displayName || "")}</span>`);

  let data;
  try {
    data = await apiGetClaim(requestId, userProfile.userId);
  } catch (_) {
    hideLoader();
    renderSystemError("ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง");
    return;
  }

  if (!data?.ok || !data.claim) {
    hideLoader();
    String(data?.error || "") === "claim_not_found"
      ? renderNotFound()
      : (String(data?.error || "") === "not_authorized"
          ? renderForbidden("คุณไม่มีสิทธิ์ดูรายการนี้")
          : renderSystemError("ไม่สามารถดึงข้อมูลรายการได้"));
    return;
  }

  claimData = data.claim;

  // Ownership + status guard (double-checked on server, but guard here too for UX)
  if (String(claimData.userId || "").trim() !== String(userProfile.userId || "").trim()) {
    hideLoader(); renderForbidden("รายการนี้ไม่ใช่ของคุณ"); return;
  }
  if (String(claimData.status || "").toUpperCase() !== "DRAFT") {
    hideLoader(); renderForbidden("แก้ไขรายละเอียดได้เฉพาะตอนรายการยังเป็น Draft"); return;
  }

  renderForm(claimData);
  hideLoader();
}

init().catch(err => {
  console.error(err);
  hideLoader();
  renderSystemError("LIFF Init Error: " + (err?.message || err));
});
</script>
</body>
</html>
