<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
  <title>Edit Amount</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background:#F3F4F6; color:#1F2937; -webkit-tap-highlight-color: transparent; }
    .card { background:#fff; border-radius: 1.25rem; border:1px solid #E5E7EB; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); padding: 1.1rem; }

    .input { background:#F9FAFB; border:1px solid #D1D5DB; border-radius:.9rem; padding:.85rem; width:100%; outline:none; transition:.2s; font-size:.95rem; color:#374151; font-weight: bold; }
    .input:focus { background:#fff; border-color:#3B82F6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
    .err { border-color:#EF4444 !important; background-color:#FEF2F2 !important; box-shadow:0 0 0 3px rgba(239,68,68,.15) !important; }

    .info-badge { font-size:11px; font-weight:700; background:#EFF6FF; color:#2563EB; padding:4px 12px; border-radius:9999px; border:1px solid #DBEAFE; display:inline-flex; align-items:center; white-space:nowrap; }

    .btn-disabled { opacity: .55; cursor: not-allowed; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>

<body class="pb-24 antialiased">
  <div class="max-w-md mx-auto min-h-screen flex flex-col relative">

    <div class="bg-white px-6 pt-10 pb-4 rounded-b-3xl shadow-sm mb-5 relative z-10 border-b border-slate-100">
      <div class="flex items-center gap-4">
        <div id="avatarBox" class="w-12 h-12 rounded-full overflow-hidden border-2 border-white shadow-md ring-2 ring-blue-50 hidden">
          <img id="profileImg" src="" class="w-full h-full object-cover" alt="profile">
        </div>
        <div class="flex-1">
          <h1 id="title" class="text-2xl font-bold text-[#1F2937] tracking-tight">Edit Amount ✏️</h1>
          <p id="subTitle" class="text-[#9CA3AF] text-sm font-medium mt-0.5 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Loading...
          </p>
        </div>
        <span id="statusBadge" class="hidden info-badge">Draft</span>
      </div>
    </div>

    <div class="px-5 pb-24" id="rootBox"></div>

    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-[#F3F4F6] p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom))] z-40 hidden" id="bottomBar">
      <button id="submitBtn" onclick="handleSubmit()"
        class="w-full bg-[#60A5FA] hover:bg-[#3B82F6] text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-200 active:scale-[0.98] transition-all">
        บันทึกยอดเงิน
      </button>
    </div>

    <div id="loader" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50">
      <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center max-w-[180px] w-full">
        <div class="w-10 h-10 border-4 border-[#F3F4F6] border-t-[#3B82F6] rounded-full animate-spin mb-4"></div>
        <div class="font-bold text-[#1F2937] text-sm" id="loaderText">Processing...</div>
      </div>
    </div>
  </div>

<script>
  const LIFF_ID = "2008997153-opOWuU0Y";
  const API_URL = "https://script.google.com/macros/s/AKfycbzjatOY93-6QIVPdBSxJyzQhMw9DfqwlgFVdvEanLpZgNZ_1ACwyrUKMGvgnCArwSzWHQ/exec";

  const $ = (id) => document.getElementById(id);

  let userProfile = null;
  let claimData = null;
  let requestId = "";

  function showLoader(msg){
    $("loaderText").textContent = msg || "Processing...";
    $("loader").classList.remove("hidden");
    $("loader").classList.add("flex");
  }

  function hideLoader(){
    $("loader").classList.add("hidden");
    $("loader").classList.remove("flex");
  }

  function doneAndExit(){
    try {
      if (window.liff && liff.isInClient()) {
        liff.closeWindow();
        return;
      }
    } catch(e) {}
    try { window.close(); } catch(e) {}
  }

  function escapeHtml_(s) {
    return String(s ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#39;");
  }

  function setHeader_(title, subtitle) {
    $("title").textContent = title || "Edit Amount ✏️";
    $("subTitle").innerHTML = subtitle || "";
  }

  function setStatusBadge_(text) {
    const el = $("statusBadge");
    if (!text) {
      el.classList.add("hidden");
      return;
    }
    el.textContent = text;
    el.classList.remove("hidden");
  }

  function setBtnDisabled_(disabled) {
    const btn = $("submitBtn");
    btn.disabled = !!disabled;
    btn.classList.toggle("btn-disabled", !!disabled);
  }

  function kvRow_(label, valueHtml) {
    return `
      <div class="flex items-baseline space-x-3">
        <span class="text-[#9CA3AF] text-xs w-20 flex-shrink-0">${escapeHtml_(label)}</span>
        <span class="font-bold text-[#1F2937] text-sm break-words flex-1 text-right">${valueHtml}</span>
      </div>`;
  }

  // --- Screens ---
  function renderSystemError_(msg) {
    setHeader_("System Error", "Please try again");
    setStatusBadge_("");
    $("bottomBar").classList.add("hidden");
    $("rootBox").innerHTML = `
      <div class="card text-center py-10 mt-6">
        <div class="text-4xl mb-3">⚠️</div>
        <div class="text-lg font-bold text-[#1F2937]">System Error</div>
        <div class="text-sm text-[#9CA3AF] mt-2">${escapeHtml_(msg || "ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง")}</div>
        <button class="w-full mt-6 bg-[#60A5FA] hover:bg-[#3B82F6] shadow-lg shadow-blue-200 text-white py-3.5 rounded-2xl font-bold active:scale-[0.98] transition-all" onclick="location.reload()">Try Again</button>
        <button class="w-full mt-3 bg-white border border-[#E5E7EB] text-[#9CA3AF] py-3 rounded-2xl font-bold hover:bg-[#F9FAFB] transition-colors active:scale-[0.98]" onclick="doneAndExit()">Close</button>
      </div>`;
  }

  function renderNotFound_() {
    setHeader_("Not Found", "Error");
    setStatusBadge_("");
    $("bottomBar").classList.add("hidden");
    $("rootBox").innerHTML = `
      <div class="card text-center py-10 mt-6">
        <div class="text-4xl mb-3">📄❓</div>
        <div class="text-lg font-bold text-[#1F2937]">ไม่พบรายการเบิกเงินค่ะ</div>
        <div class="text-sm text-[#9CA3AF] mt-2">โปรดตรวจสอบลิงก์อีกครั้ง</div>
        <button class="w-full mt-6 bg-[#60A5FA] hover:bg-[#3B82F6] shadow-lg shadow-blue-200 text-white py-3.5 rounded-2xl font-bold active:scale-[0.98] transition-all" onclick="doneAndExit()">ปิดหน้าต่าง</button>
      </div>`;
  }

  function renderForbidden_(msg) {
    setHeader_("Not Allowed", "Action not permitted");
    setStatusBadge_("");
    $("bottomBar").classList.add("hidden");
    $("rootBox").innerHTML = `
      <div class="card text-center py-10 mt-6">
        <div class="text-4xl mb-3">⛔</div>
        <div class="text-lg font-bold text-[#1F2937]">ไม่สามารถแก้ไขยอดเงินได้</div>
        <div class="text-sm text-[#9CA3AF] mt-2">${escapeHtml_(msg || "รายการนี้ไม่อยู่ในสถานะ Draft หรือไม่ใช่ของคุณ")}</div>
        <button class="w-full mt-6 bg-[#60A5FA] hover:bg-[#3B82F6] shadow-lg shadow-blue-200 text-white py-3.5 rounded-2xl font-bold active:scale-[0.98] transition-all" onclick="doneAndExit()">ปิดหน้าต่าง</button>
      </div>`;
  }

  // --- Helpers ---
  function formatAmountForInput_(v) {
    const n = Number(v || 0);
    if (isNaN(n)) return "";
    return String(n);
  }

  function formatAmountTHB_(v) {
    const n = Number(v || 0);
    if (isNaN(n)) return "-";
    return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " บาท";
  }

  function shortReqId_(reqId) {
    const s = String(reqId || "");
    return "#" + (s.length <= 8 ? s : s.slice(-8));
  }

  function parseAmountClient_(raw) {
    let s = String(raw || "").trim();
    if (!s) return { ok: false };
    s = s.replace(/บาท/gi, "").replace(/,/g, "").replace(/\s+/g, "");
    if (!/^\d+(\.\d{1,2})?$/.test(s)) return { ok: false };
    const amount = Number(s);
    if (isNaN(amount) || amount <= 0) return { ok: false };
    return { ok: true, amount, normalized: s };
  }

  function clearErr_() {
    $("amountInput").classList.remove("err");
    $("amountErr").classList.add("hidden");
  }

  function showErr_(msg) {
    $("amountInput").classList.add("err");
    $("amountErr").textContent = msg;
    $("amountErr").classList.remove("hidden");
  }

  // --- Main Render ---
  function renderForm_(claim) {
    const reqNo = shortReqId_(claim.requestId);
    const status = String(claim.status || "").toUpperCase();

    setHeader_("Edit Amount ✏️", `Hi, <span class="font-bold text-[#1F2937]">${escapeHtml_(userProfile?.displayName || "")}</span>`);
    setStatusBadge_(status || "Draft");

    $("rootBox").innerHTML = `
      <div class="card mb-5 text-center pt-6 pb-5 mt-2">
         <div class="w-16 h-16 rounded-full bg-[#EFF6FF] flex items-center justify-center text-[#3B82F6] text-3xl mx-auto mb-3 shadow-inner">💸</div>
         <div class="font-bold text-[#1F2937] text-lg">Claim Amount</div>
         <div class="text-xs text-[#9CA3AF] mt-1 font-mono">Req No. ${escapeHtml_(reqNo)}</div>
      </div>

      <div class="card space-y-4 mb-5">
        <div class="space-y-3 px-1 mt-1">
          ${kvRow_("Company", escapeHtml_(claim.company || "-"))}
          ${kvRow_("Status", `<span class="text-[#2563EB]">${escapeHtml_(status || "-")}</span>`)}
          ${kvRow_("Current", escapeHtml_(formatAmountTHB_(claim.amount)))}
        </div>
        
        <hr class="border-[#F3F4F6] my-4" />
        
        <div class="px-1">
          <label class="text-sm font-bold text-[#1F2937] block mb-2">New Amount <span class="text-[#EF4444]">*</span></label>
          <input id="amountInput" type="text" inputmode="decimal" class="input text-center text-lg text-[#2563EB]" placeholder="เช่น 1200 หรือ 1,200.50" value="${escapeHtml_(formatAmountForInput_(claim.amount))}">
          <div id="amountErr" class="hidden text-xs text-[#EF4444] mt-2 font-bold text-center"></div>
        </div>

        <div class="flex items-start gap-2 bg-[#F8FAFC] p-3 rounded-xl border border-[#F1F5F9] mt-4">
          <span class="text-[#94A3B8] mt-0.5">ℹ️</span>
          <div class="text-[11px] text-[#64748B] font-medium leading-relaxed">
            สามารถแก้ไขยอดเงินเบิกได้เฉพาะตอนรายการยังเป็น Draft เท่านั้น
          </div>
        </div>
      </div>
    `;

    $("amountInput").addEventListener("input", clearErr_);
    $("bottomBar").classList.remove("hidden");
    setBtnDisabled_(false);
  }

  // --- API Calls ---
  async function apiGetClaim_(requestId) {
    const res = await fetch(API_URL + "?action=get_claim&requestId=" + encodeURIComponent(requestId) + "&t=" + Date.now());
    return res.json();
  }

  async function postFormUrlEncoded_(obj) {
    const body = new URLSearchParams();
    Object.keys(obj || {}).forEach(k => body.set(k, obj[k] == null ? "" : String(obj[k])));
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
      body: body.toString()
    });
    return res.json();
  }

  async function handleSubmit() {
    clearErr_();

    const raw = ($("amountInput")?.value || "").trim();
    const parsed = parseAmountClient_(raw);
    if (!parsed.ok) {
      showErr_("กรุณาระบุยอดเงินให้ถูกต้อง (เช่น 1200 หรือ 1,200.50)");
      return;
    }

    try {
      showLoader("Saving...");
      setBtnDisabled_(true);

      const data = await postFormUrlEncoded_({
        action: "update_claim_amount",
        requestId,
        actorUserId: userProfile.userId,
        amount: parsed.normalized
      });

      if (!data || !data.ok) {
        hideLoader();
        setBtnDisabled_(false);

        const errCode = String(data?.error || "unknown_error");

        if (errCode === "missing_amount" || errCode === "invalid_amount") {
          showErr_("กรุณาระบุยอดเงินให้ถูกต้อง"); return;
        }
        if (errCode === "not_owner") {
          renderForbidden_("รายการนี้ไม่ใช่ของคุณ"); return;
        }
        if (errCode === "cannot_edit_non_draft") {
          renderForbidden_("แก้ไขยอดเงินได้เฉพาะตอนรายการยังเป็น Draft"); return;
        }
        if (errCode === "claim_not_found") {
          renderNotFound_(); return;
        }

        alert("❌ Save failed: " + errCode);
        return;
      }

      try { await liff.sendMessages([{ type: "text", text: "CLAIM_DRAFT_UPDATED:" + requestId }]); } catch (e) {}

      hideLoader();
      $("bottomBar").classList.add("hidden");
      $("rootBox").innerHTML = `
        <div class="card text-center py-12 mt-10 border border-[#10B981] shadow-lg shadow-green-100">
          <div class="w-20 h-20 rounded-full bg-[#ECFDF5] flex items-center justify-center text-[#10B981] text-4xl mx-auto mb-4 animate-bounce">✅</div>
          <div class="text-xl font-bold text-[#1F2937]">Amount updated.</div>
          <div class="text-sm text-[#9CA3AF] mt-2">อัปเดตยอดเงินเรียบร้อยแล้ว</div>
        </div>
      `;

      setTimeout(() => doneAndExit(), 1200);

    } catch (e) {
      hideLoader();
      setBtnDisabled_(false);
      alert("❌ Save failed: " + (e?.message || e));
    }
  }

  async function init() {
    showLoader("Loading...");

    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const params = new URLSearchParams(location.search);
    requestId = String(params.get("requestId") || "").trim();

    if (!requestId) {
      hideLoader();
      renderNotFound_();
      return;
    }

    userProfile = await liff.getProfile();

    if (userProfile.pictureUrl) {
      $("profileImg").src = userProfile.pictureUrl;
      $("avatarBox").classList.remove("hidden");
    }

    setHeader_("Edit Amount ✏️", `Hi, <span class="font-bold text-[#1F2937]">${escapeHtml_(userProfile.displayName || "")}</span>`);
    setStatusBadge_("Loading");

    let data;
    try {
      data = await apiGetClaim_(requestId);
    } catch (e) {
      hideLoader();
      renderSystemError_("ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง");
      return;
    }

    if (!data || !data.ok || !data.claim) {
      hideLoader();
      if (String(data?.error || "") === "claim_not_found") {
        renderNotFound_();
      } else {
        renderSystemError_("ไม่สามารถดึงข้อมูลรายการได้");
      }
      return;
    }

    claimData = data.claim;

    if (String(claimData.userId || "").trim() !== String(userProfile.userId || "").trim()) {
      hideLoader();
      renderForbidden_("รายการนี้ไม่ใช่ของคุณ");
      return;
    }

    if (String(claimData.status || "").toUpperCase() !== "DRAFT") {
      hideLoader();
      renderForbidden_("แก้ไขยอดเงินได้เฉพาะตอนรายการยังเป็น Draft");
      return;
    }

    renderForm_(claimData);
    hideLoader();
  }

  init().catch(err => {
    console.error(err);
    hideLoader();
    renderSystemError_("LIFF Init Error: " + (err?.message || err));
  });
</script>
</body>
</html>
