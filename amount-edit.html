<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
  <title>Edit Claim Amount</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: #f8fafc; 
      color: #0f172a; 
      -webkit-tap-highlight-color: transparent; 
    }
    .err { 
      border-color: #ef4444 !important; 
      background-color: #fef2f2 !important; 
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15) !important; 
    }
    .btn-disabled { 
      opacity: 0.5; 
      cursor: not-allowed; 
      transform: none !important;
    }
    .info-badge { 
      font-size: 11px; 
      font-weight: 700; 
      background: linear-gradient(to right, #eff6ff, #dbeafe); 
      color: #2563eb; 
      padding: 6px 14px; 
      border-radius: 9999px; 
      border: 1px solid #bfdbfe; 
      display: inline-flex; 
      align-items: center; 
      white-space: nowrap; 
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.05);
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>

<body class="pb-28 antialiased bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen">
  <div class="max-w-md mx-auto min-h-screen flex flex-col relative">

    <div class="bg-white/80 backdrop-blur-lg px-6 pt-12 pb-6 rounded-b-[2rem] shadow-[0_4px_20px_rgb(0,0,0,0.03)] mb-6 relative z-10 border-b border-white">
      <div class="flex items-center gap-4">
        <div id="avatarBox" class="w-14 h-14 rounded-full overflow-hidden border-[3px] border-white shadow-md hidden">
          <img id="profileImg" src="" class="w-full h-full object-cover" alt="profile">
        </div>
        <div class="flex-1">
          <h1 id="title" class="text-2xl font-extrabold text-slate-800 tracking-tight">Edit Amount ✏️</h1>
          <p id="subTitle" class="text-slate-500 text-sm font-medium mt-1 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span> Loading Profile...
          </p>
        </div>
        <span id="statusBadge" class="hidden info-badge">Draft</span>
      </div>
    </div>

    <div class="px-5 space-y-5 flex-1" id="rootBox">
      </div>

    <div class="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-white via-white/95 to-transparent pt-10 pb-[calc(1.5rem+env(safe-area-inset-bottom))] px-6 z-40" id="bottomBar">
      <button id="submitBtn"
        onclick="handleSubmit()"
        class="w-full bg-gradient-to-r from-blue-500 to-indigo-500 hover:from-blue-600 hover:to-indigo-600 text-white py-4.5 rounded-2xl font-bold text-lg shadow-[0_8px_20px_rgba(59,130,246,0.3)] active:scale-[0.98] transition-all duration-200">
        บันทึกข้อมูล
      </button>
    </div>

    <div id="loader" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm hidden items-center justify-center z-50 transition-opacity">
      <div class="bg-white p-7 rounded-[2rem] shadow-2xl flex flex-col items-center max-w-[200px] w-full border border-white">
        <div class="w-12 h-12 border-[4px] border-slate-100 border-t-blue-500 rounded-full animate-spin mb-5"></div>
        <div class="font-bold text-slate-700 text-sm tracking-wide" id="loaderText">Processing...</div>
      </div>
    </div>
  </div>

<script>
  // ================= CONFIG =================
  const LIFF_ID = "2008997153-opOWuU0Y";
  const API_URL = "https://script.google.com/macros/s/AKfycbzjatOY93-6QIVPdBSxJyzQhMw9DfqwlgFVdvEanLpZgNZ_1ACwyrUKMGvgnCArwSzWHQ/exec";
  // ==========================================

  const $ = (id) => document.getElementById(id);

  let userProfile = null;
  let claimData = null;
  let requestId = "";

  function showLoader(msg){
    $("loaderText").textContent = msg || "Processing...";
    $("loader").classList.remove("hidden");
    $("loader").classList.add("flex");
  }

  function hideLoader(){
    $("loader").classList.add("hidden");
    $("loader").classList.remove("flex");
  }

  function doneAndExit(){
    try {
      if (window.liff && liff.isInClient()) {
        liff.closeWindow();
        return;
      }
    } catch(e) {}
    try { window.close(); } catch(e) {}
  }

  function escapeHtml_(s) {
    return String(s ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#39;");
  }

  function setHeader_(title, subtitle) {
    $("title").textContent = title || "Edit Amount ✏️";
    $("subTitle").innerHTML = subtitle || "";
  }

  function setStatusBadge_(text) {
    const el = $("statusBadge");
    if (!text) {
      el.classList.add("hidden");
      return;
    }
    el.textContent = text;
    el.classList.remove("hidden");
  }

  function setBtnDisabled_(disabled) {
    const btn = $("submitBtn");
    btn.disabled = !!disabled;
    btn.classList.toggle("btn-disabled", !!disabled);
  }

  // --- UI Components ---
  function renderSystemError_(msg) {
    $("title").textContent = "System Error";
    $("subTitle").textContent = "Please try again";
    $("rootBox").innerHTML = `
      <div class="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 text-center py-12 px-6">
        <div class="text-5xl mb-4">⚠️</div>
        <div class="text-xl font-bold text-slate-800">System Error</div>
        <div class="text-sm text-slate-500 mt-2">${escapeHtml_(msg || "ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง")}</div>
        <button class="w-full mt-8 bg-slate-800 hover:bg-slate-700 text-white py-4 rounded-2xl font-bold active:scale-[0.98] transition-all" onclick="location.reload()">Try Again</button>
        <button class="w-full mt-3 bg-white border border-slate-200 text-slate-500 py-4 rounded-2xl font-bold hover:bg-slate-50 transition-colors active:scale-[0.98]" onclick="doneAndExit()">Close</button>
      </div>
    `;
    $("bottomBar").classList.add("hidden");
  }

  function renderNotFound_() {
    $("title").textContent = "Not Found";
    $("subTitle").textContent = "Error";
    $("rootBox").innerHTML = `
      <div class="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 text-center py-12 px-6">
        <div class="text-5xl mb-4">📄❓</div>
        <div class="text-xl font-bold text-slate-800">ไม่พบรายการเบิกเงินค่ะ</div>
        <div class="text-sm text-slate-500 mt-2">โปรดตรวจสอบลิงก์อีกครั้ง</div>
        <button class="w-full mt-8 bg-blue-500 hover:bg-blue-600 shadow-[0_8px_20px_rgba(59,130,246,0.2)] text-white py-4 rounded-2xl font-bold active:scale-[0.98] transition-all" onclick="doneAndExit()">ปิดหน้าต่าง</button>
      </div>
    `;
    $("bottomBar").classList.add("hidden");
  }

  function renderForbidden_(msg) {
    $("title").textContent = "Not Allowed";
    $("subTitle").textContent = "Action not permitted";
    $("rootBox").innerHTML = `
      <div class="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 text-center py-12 px-6">
        <div class="text-5xl mb-4">⛔</div>
        <div class="text-xl font-bold text-slate-800">ไม่สามารถแก้ไขยอดเงินได้</div>
        <div class="text-sm text-slate-500 mt-2">${escapeHtml_(msg || "รายการนี้ไม่อยู่ในสถานะ Draft หรือไม่ใช่ของคุณ")}</div>
        <button class="w-full mt-8 bg-slate-800 hover:bg-slate-700 text-white py-4 rounded-2xl font-bold active:scale-[0.98] transition-all" onclick="doneAndExit()">ปิดหน้าต่าง</button>
      </div>
    `;
    $("bottomBar").classList.add("hidden");
  }

  // --- Formatters ---
  function formatAmountForInput_(v) {
    const n = Number(v || 0);
    if (isNaN(n)) return "";
    return String(n);
  }

  function formatAmountTHB_(v) {
    const n = Number(v || 0);
    if (isNaN(n)) return "-";
    return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function shortReqId_(reqId) {
    const s = String(reqId || "");
    return "#" + (s.length <= 8 ? s : s.slice(-8));
  }

  function parseAmountClient_(raw) {
    let s = String(raw || "").trim();
    if (!s) return { ok: false };
    s = s.replace(/บาท/gi, "").replace(/,/g, "").replace(/\s+/g, "");
    if (!/^\d+(\.\d{1,2})?$/.test(s)) return { ok: false };
    const amount = Number(s);
    if (isNaN(amount) || amount <= 0) return { ok: false };
    return { ok: true, amount, normalized: s };
  }

  function clearErr_() {
    $("amountInput").classList.remove("err");
    $("amountErr").classList.add("hidden");
  }

  function showErr_(msg) {
    $("amountInput").classList.add("err");
    $("amountErr").textContent = msg;
    $("amountErr").classList.remove("hidden");
  }

  // --- Main Form Render ---
  function renderForm_(claim) {
    const reqNo = shortReqId_(claim.requestId);
    const status = String(claim.status || "").toUpperCase();

    setHeader_("Edit Amount ✏️", `Hi, <span class="font-bold text-slate-800">${escapeHtml_(userProfile?.displayName || "")}</span>`);
    setStatusBadge_(status || "Draft");

    $("rootBox").innerHTML = `
      <div class="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-slate-100 p-6 space-y-6">
        
        <div class="text-center pb-2 border-b border-slate-50">
          <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-50/80 rounded-[1.25rem] mb-4">
            <span class="text-3xl">💸</span>
          </div>
          <div class="text-xl font-extrabold text-slate-800 tracking-tight">Claim Amount</div>
          <div class="text-xs text-slate-400 mt-1 font-mono tracking-wide bg-slate-50 inline-block px-3 py-1 rounded-full border border-slate-100">Req No. ${escapeHtml_(reqNo)}</div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="bg-slate-50/80 rounded-2xl border border-slate-100 p-3.5 text-center">
            <div class="text-[10px] uppercase tracking-widest font-bold text-slate-400">Company</div>
            <div class="text-sm font-bold text-slate-700 mt-1 truncate">${escapeHtml_(claim.company || "-")}</div>
          </div>
          <div class="bg-slate-50/80 rounded-2xl border border-slate-100 p-3.5 text-center">
            <div class="text-[10px] uppercase tracking-widest font-bold text-slate-400">Status</div>
            <div class="text-sm font-bold text-slate-700 mt-1 truncate">${escapeHtml_(status || "-")}</div>
          </div>
        </div>

        <div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-2xl border border-blue-100 p-5 text-center relative overflow-hidden">
          <div class="absolute -right-4 -top-4 w-16 h-16 bg-white/40 rounded-full blur-xl"></div>
          <div class="text-[11px] uppercase tracking-widest font-bold text-blue-500 mb-1 relative z-10">Current Amount</div>
          <div class="text-3xl font-black text-blue-700 relative z-10 flex justify-center items-baseline gap-1">
            <span class="text-lg text-blue-500 font-bold">฿</span> 
            ${escapeHtml_(formatAmountTHB_(claim.amount))}
          </div>
        </div>

        <div class="pt-2">
          <label class="text-sm font-extrabold text-slate-700 block mb-2 ml-1">New Amount <span class="text-red-500">*</span></label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-lg">฿</span>
            <input id="amountInput" type="text" inputmode="decimal" 
              class="w-full bg-slate-50 border-2 border-slate-100 rounded-[1.25rem] py-4 pl-10 pr-4 text-xl font-bold text-slate-800 outline-none focus:bg-white focus:border-blue-400 focus:ring-4 focus:ring-blue-400/10 transition-all placeholder:font-medium placeholder:text-slate-300" 
              placeholder="1,200.50" 
              value="${escapeHtml_(formatAmountForInput_(claim.amount))}">
          </div>
          <div id="amountErr" class="hidden text-xs text-red-500 mt-2 font-bold px-2"></div>
        </div>

        <div class="flex items-start gap-3 bg-amber-50 rounded-2xl p-4 border border-amber-100/50">
          <span class="text-amber-500 text-base mt-0.5">💡</span>
          <div class="text-[12px] text-amber-700 font-medium leading-relaxed pr-2">
            สามารถแก้ไขยอดเงินได้เฉพาะตอนรายการยังเป็น <span class="font-bold underline decoration-amber-300 underline-offset-2">Draft</span> เท่านั้น
          </div>
        </div>
      </div>
    `;

    $("amountInput").addEventListener("input", clearErr_);
    $("bottomBar").classList.remove("hidden");
    setBtnDisabled_(false);
  }

  async function apiGetClaim_(requestId) {
    const res = await fetch(API_URL + "?action=get_claim&requestId=" + encodeURIComponent(requestId) + "&t=" + Date.now());
    return res.json();
  }

  async function postFormUrlEncoded_(obj) {
    const body = new URLSearchParams();
    Object.keys(obj || {}).forEach(k => body.set(k, obj[k] == null ? "" : String(obj[k])));
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
      body: body.toString()
    });
    return res.json();
  }

  async function handleSubmit() {
    clearErr_();

    const raw = ($("amountInput")?.value || "").trim();
    const parsed = parseAmountClient_(raw);
    if (!parsed.ok) {
      showErr_("กรุณาระบุยอดเงินให้ถูกต้อง (เช่น 1200 หรือ 1,200.50)");
      return;
    }

    try {
      showLoader("Saving Updates...");
      setBtnDisabled_(true);

      const data = await postFormUrlEncoded_({
        action: "update_claim_amount",
        requestId,
        actorUserId: userProfile.userId,
        amount: parsed.normalized
      });

      if (!data || !data.ok) {
        hideLoader();
        setBtnDisabled_(false);

        const errCode = String(data?.error || "unknown_error");
        if (errCode === "missing_amount" || errCode === "invalid_amount") {
          showErr_("กรุณาระบุยอดเงินให้ถูกต้อง"); return;
        }
        if (errCode === "not_owner") {
          renderForbidden_("รายการนี้ไม่ใช่ของคุณ"); return;
        }
        if (errCode === "cannot_edit_non_draft") {
          renderForbidden_("แก้ไขยอดเงินได้เฉพาะตอนรายการยังเป็น Draft"); return;
        }
        if (errCode === "claim_not_found") {
          renderNotFound_(); return;
        }
        alert("❌ Save failed: " + errCode);
        return;
      }

      // Success! Update LINE Chat via LIFF
      try {
        await liff.sendMessages([{ type: "text", text: "CLAIM_DRAFT_UPDATED:" + requestId }]);
      } catch (e) {}

      hideLoader();
      $("bottomBar").classList.add("hidden");
      
      // Success Screen
      $("rootBox").innerHTML = `
        <div class="bg-white rounded-[2rem] text-center py-12 px-6 mt-8 border-2 border-emerald-400 shadow-[0_10px_40px_rgba(16,185,129,0.15)] relative overflow-hidden">
          <div class="w-24 h-24 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-500 text-5xl mx-auto mb-5 animate-[bounce_1s_ease-in-out_infinite]">✅</div>
          <div class="text-2xl font-black text-slate-800">Amount Updated!</div>
          <div class="text-sm text-slate-500 mt-2 font-medium">บันทึกข้อมูลเรียบร้อยแล้ว<br>ระบบได้ส่งข้อมูลกลับไปที่แชท LINE แล้วครับ</div>
        </div>
      `;

      setTimeout(() => doneAndExit(), 1500);

    } catch (e) {
      hideLoader();
      setBtnDisabled_(false);
      alert("❌ Save failed: " + (e?.message || e));
    }
  }

  async function init() {
    // Check if running in browser for testing
    const isLocalTest = !window.liff || location.hostname === "localhost" || location.hostname === "127.0.0.1";
    
    if (!isLocalTest) {
      showLoader("Loading App...");
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      userProfile = await liff.getProfile();
    } else {
      // Mock data for browser preview
      userProfile = { userId: "Umock123", displayName: "Test User", pictureUrl: "https://i.pravatar.cc/150" };
    }

    const params = new URLSearchParams(location.search);
    requestId = String(params.get("requestId") || "REQ-MOCK").trim();

    if (!requestId) {
      hideLoader();
      renderNotFound_();
      return;
    }

    if (userProfile.pictureUrl) {
      $("profileImg").src = userProfile.pictureUrl;
      $("avatarBox").classList.remove("hidden");
    }

    setHeader_("Edit Amount ✏️", `Hi, <span class="font-bold text-slate-800">${escapeHtml_(userProfile.displayName || "")}</span>`);

    if (isLocalTest && params.get("requestId") === "REQ-MOCK") {
      // Mock render for testing visual
      hideLoader();
      renderForm_({ requestId: "REQ-000123", status: "DRAFT", company: "TokTok Co.,Ltd.", amount: "3500", userId: "Umock123" });
      return;
    }

    let data;
    try {
      data = await apiGetClaim_(requestId);
    } catch (e) {
      hideLoader();
      renderSystemError_("ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง");
      return;
    }

    if (!data || !data.ok || !data.claim) {
      hideLoader();
      if (String(data?.error || "") === "claim_not_found") {
        renderNotFound_();
      } else {
        renderSystemError_("ไม่สามารถดึงข้อมูลรายการได้");
      }
      return;
    }

    claimData = data.claim;

    if (String(claimData.userId || "").trim() !== String(userProfile.userId || "").trim()) {
      hideLoader();
      renderForbidden_("รายการนี้ไม่ใช่ของคุณ");
      return;
    }

    if (String(claimData.status || "").toUpperCase() !== "DRAFT") {
      hideLoader();
      renderForbidden_("แก้ไขยอดเงินได้เฉพาะตอนรายการยังเป็น Draft");
      return;
    }

    renderForm_(claimData);
    hideLoader();
  }

  init().catch(err => {
    console.error(err);
    hideLoader();
    renderSystemError_("Init Error: " + (err?.message || err));
  });
</script>
</body>
</html>
